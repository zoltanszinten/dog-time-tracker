<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b42">
  <meta name="description" content="Track time spent outside with your dogs, one day at a time.">
  <title>Dog Time</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23142b42'/%3E%3Cpath d='M17 33c-4-1-5-7-2-9 4-3 8 2 8 6m6-7c-3-3-2-9 2-10 5-1 7 5 5 9m7 5c-1-4 2-8 6-7 5 2 4 8 1 10M21 45c0-7 8-12 11-12s11 5 11 12c0 5-4 7-8 5-2-1-4-1-6 0-4 2-8 0-8-5Z' fill='%23ffcc4d'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eaf2f8; color: #142b42; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 790px; margin: 0 auto; padding: 34px 22px 72px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 29px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; font-weight: 800; letter-spacing: -.025em; }
    .brand-mark { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 12px; background: #142b42; color: #ffcc4d; font-size: 1.3rem; }
    .today-label { color: #46647d; font-size: .9rem; font-weight: 650; text-align: right; }
    .today-card { background: #142b42; color: white; border-radius: 28px; padding: 34px 38px 35px; box-shadow: 0 18px 45px rgba(20,43,66,.16); position: relative; overflow: hidden; }
    .today-card::after { content: ""; position: absolute; width: 190px; height: 190px; border: 32px solid rgba(255,255,255,.045); border-radius: 50%; right: -72px; top: -72px; pointer-events: none; }
    .eyebrow { margin: 0 0 13px; color: #b9d3e5; font-size: .95rem; font-weight: 700; }
    .total { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 15px; line-height: 1; font-variant-numeric: tabular-nums; }
    .total strong { font-size: clamp(3.6rem, 10vw, 5.8rem); letter-spacing: -.075em; font-weight: 760; }
    .total span { font-size: 1.2rem; color: #c8dceb; font-weight: 600; margin-right: 12px; }
    .today-note { margin: 21px 0 0; color: #c8dceb; font-size: .95rem; }
    .add-card, .list-card { background: white; border: 1px solid #d6e4ef; border-radius: 22px; box-shadow: 0 8px 28px rgba(20,43,66,.045); }
    .add-card { margin-top: 20px; padding: 26px 28px 28px; }
    h1, h2 { margin: 0; letter-spacing: -.035em; }
    h1 { font-size: 1.38rem; }
    h2 { font-size: 1.22rem; }
    .entry-form { display: flex; gap: 11px; align-items: stretch; margin-top: 18px; }
    .input-wrap { flex: 1; position: relative; }
    .minutes-input { width: 100%; height: 53px; padding: 0 112px 0 17px; border: 2px solid #cedeea; border-radius: 13px; background: #f8fbfe; color: #142b42; outline: none; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .minutes-input:focus { border-color: #358ad1; box-shadow: 0 0 0 3px rgba(53,138,209,.17); }
    .input-suffix { position: absolute; right: 17px; top: 50%; transform: translateY(-50%); color: #587086; pointer-events: none; }
    .add-button { min-width: 146px; border: 0; border-radius: 13px; color: #142b42; background: #ffcc4d; padding: 0 19px; font-weight: 800; transition: background .15s, transform .15s; }
    .add-button:hover { background: #ffd769; }
    .add-button:active { transform: translateY(1px); }
    .add-button:focus-visible, .remove-button:focus-visible { outline: 3px solid #358ad1; outline-offset: 3px; }
    .feedback { min-height: 1.35em; margin: 10px 0 0; color: #b13e3e; font-size: .9rem; }
    .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; align-items: start; }
    .list-card { padding: 23px 23px 13px; height: 250px; display: flex; flex-direction: column; min-height: 0; }
    .list-card h2 { margin-bottom: 17px; }
    .empty { color: #6c8294; line-height: 1.5; margin: 0 0 16px; font-size: .94rem; }
    .rows { list-style: none; padding: 0; margin: 0; flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; scrollbar-gutter: stable; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid #e7eef4; padding: 14px 0; }
    .row-main { min-width: 0; }
    .row-title { display: block; font-weight: 750; line-height: 1.3; font-variant-numeric: tabular-nums; }
    .row-sub { display: block; color: #6c8294; font-size: .85rem; margin-top: 3px; }
    .row-side { display: flex; align-items: center; gap: 6px; }
    .history-total { white-space: nowrap; font-weight: 780; font-variant-numeric: tabular-nums; }
    .remove-button { border: 0; background: transparent; color: #6c8294; width: 34px; height: 34px; border-radius: 9px; font-size: 1.25rem; line-height: 1; }
    .remove-button:hover { background: #fce8e8; color: #a53939; }
    .file-warning { background: #fff3c7; border: 1px solid #ead481; border-radius: 16px; padding: 17px 20px; margin-bottom: 20px; line-height: 1.5; }
    @media (max-width: 650px) {
      .shell { padding: 20px 14px 44px; }
      .top { margin-bottom: 20px; }
      .today-card { padding: 27px 25px 29px; border-radius: 23px; }
      .add-card { padding: 22px 20px 16px; }
      .lists { grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }
    }
    @media (max-width: 420px) {
      .entry-form { flex-direction: column; }
      .add-button { min-height: 50px; }
      .today-label { max-width: 145px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🐾</span><span>Dog Time</span></div>
      <time class="today-label" id="today-date"></time>
    </header>
    <p class="file-warning" id="file-warning" hidden>Open <strong>Start Dog Time.cmd</strong> in this folder to use Dog Time.</p>

    <section class="today-card" aria-labelledby="today-heading">
      <p class="eyebrow" id="today-heading">Time outside today</p>
      <div class="total" aria-live="polite" aria-atomic="true">
        <strong id="hours">0</strong><span id="hours-label">hours</span>
        <strong id="minutes">00</strong><span id="minutes-label">minutes</span>
      </div>
      <p class="today-note" id="today-note">Add your first time outside today.</p>
    </section>

    <section class="add-card" aria-labelledby="add-heading">
      <h1 id="add-heading">Add time outside</h1>
      <form class="entry-form" id="entry-form">
        <div class="input-wrap">
          <input class="minutes-input" id="minutes-input" name="minutes" type="number" min="1" max="1440" step="1" inputmode="numeric" aria-label="Minutes outside" required disabled>
          <span class="input-suffix" aria-hidden="true">minutes</span>
        </div>
        <button class="add-button" type="submit" disabled>Add minutes</button>
      </form>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </section>

    <div class="lists">
      <section class="list-card" aria-labelledby="entries-heading">
        <h2 id="entries-heading">Today’s entries</h2>
        <p class="empty" id="entries-empty">No entries yet today.</p>
        <ul class="rows" id="entries-list"></ul>
      </section>
      <section class="list-card" aria-labelledby="history-heading">
        <h2 id="history-heading">Previous days</h2>
        <p class="empty" id="history-empty">Your previous days will appear here.</p>
        <ul class="rows" id="history-list"></ul>
      </section>
    </div>
  </main>

  <script>
    (() => {
      "use strict";
      const $ = id => document.getElementById(id);
      const dateFormatter = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
      const historyFormatter = new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
      const timeFormatter = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
      const localDay = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const parseDay = day => { const [year, month, date] = day.split("-").map(Number); return new Date(year, month - 1, date); };
      const formatDuration = total => `${Math.floor(total / 60)}h ${String(total % 60).padStart(2, "0")}m`;
      const fileMode = location.protocol === "file:";
      let entries = [];

      async function api(path, options) {
        const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json" } });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not save your entries.");
        return result;
      }

      function render() {
        const today = localDay();
        const todaysEntries = entries.filter(entry => entry.day === today).sort((a, b) => b.created - a.created);
        const total = todaysEntries.reduce((sum, entry) => sum + entry.minutes, 0);
        const entriesScroll = $("entries-list").scrollTop;
        const historyScroll = $("history-list").scrollTop;
        $("today-date").dateTime = today;
        $("today-date").textContent = dateFormatter.format(new Date());
        $("hours").textContent = String(Math.floor(total / 60));
        $("minutes").textContent = String(total % 60).padStart(2, "0");
        $("hours-label").textContent = Math.floor(total / 60) === 1 ? "hour" : "hours";
        $("minutes-label").textContent = total % 60 === 1 ? "minute" : "minutes";
        $("today-note").textContent = todaysEntries.length ? `${todaysEntries.length} ${todaysEntries.length === 1 ? "entry" : "entries"} today` : "Add your first time outside today.";

        $("entries-list").replaceChildren();
        $("entries-empty").hidden = todaysEntries.length > 0;
        todaysEntries.forEach(entry => {
          const li = document.createElement("li");
          li.className = "row";
          const main = document.createElement("div");
          main.className = "row-main";
          const title = document.createElement("span");
          title.className = "row-title";
          title.textContent = formatDuration(entry.minutes);
          const sub = document.createElement("span");
          sub.className = "row-sub";
          sub.textContent = timeFormatter.format(new Date(entry.created));
          main.append(title, sub);
          const button = document.createElement("button");
          button.className = "remove-button";
          button.type = "button";
          button.textContent = "×";
          button.setAttribute("aria-label", `Remove ${entry.minutes} minute entry from ${sub.textContent}`);
          button.disabled = fileMode;
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              const result = await api(`/api/entries/${encodeURIComponent(entry.id)}`, { method: "DELETE" });
              entries = result.entries;
              $("feedback").textContent = "";
              render();
            } catch (error) {
              $("feedback").textContent = error.message;
              button.disabled = false;
            }
          });
          li.append(main, button);
          $("entries-list").append(li);
        });

        const byDay = new Map();
        entries.filter(entry => entry.day !== today).forEach(entry => byDay.set(entry.day, (byDay.get(entry.day) || 0) + entry.minutes));
        const days = [...byDay.keys()].sort((a, b) => b.localeCompare(a));
        $("history-list").replaceChildren();
        $("history-empty").hidden = days.length > 0;
        days.forEach(day => {
          const li = document.createElement("li");
          li.className = "row";
          const date = document.createElement("span");
          date.className = "row-title";
          date.textContent = historyFormatter.format(parseDay(day));
          const duration = document.createElement("span");
          duration.className = "history-total";
          duration.textContent = formatDuration(byDay.get(day));
          li.append(date, duration);
          $("history-list").append(li);
        });
        $("entries-list").scrollTop = entriesScroll;
        $("history-list").scrollTop = historyScroll;
      }

      async function addMinutes(value) {
        const minutes = Number(value);
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440) throw new Error("Enter a whole number from 1 to 1440 minutes.");
        const result = await api("/api/entries", { method: "POST", body: JSON.stringify({ day: localDay(), minutes }) });
        entries = result.entries;
        render();
        $("entries-list").scrollTop = 0;
        return { day: localDay(), minutesAdded: minutes, totalMinutesToday: entries.filter(item => item.day === localDay()).reduce((sum, item) => sum + item.minutes, 0) };
      }

      $("entry-form").addEventListener("submit", async event => {
        event.preventDefault();
        const button = $("entry-form").querySelector("button");
        button.disabled = true;
        try {
          await addMinutes($("minutes-input").value);
          $("feedback").textContent = "";
          $("minutes-input").value = "";
        } catch (error) {
          $("feedback").textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      if (!fileMode && document.modelContext?.registerTool) {
        try {
          Promise.resolve(document.modelContext.registerTool({
            name: "add_dog_minutes",
            title: "Add dog time",
            description: "Add minutes spent outside with the dogs to today's total.",
            inputSchema: { type: "object", properties: { minutes: { type: "integer", minimum: 1, maximum: 1440 } }, required: ["minutes"], additionalProperties: false },
            annotations: { readOnlyHint: false, untrustedContentHint: false },
            execute(input) { return addMinutes(input?.minutes); }
          })).catch(() => {});
        } catch (_) {}
      }

      async function load() {
        if (fileMode) {
          $("file-warning").hidden = false;
          $("minutes-input").disabled = true;
          $("entry-form").querySelector("button").disabled = true;
        } else {
          try {
            entries = (await api("/api/entries")).entries;
            $("minutes-input").disabled = false;
            $("entry-form").querySelector("button").disabled = false;
          } catch (error) {
            $("feedback").textContent = error.message;
            $("minutes-input").disabled = true;
            $("entry-form").querySelector("button").disabled = true;
          }
        }
        render();
      }

      load();
      window.addEventListener("focus", () => { if (fileMode) render(); else load(); });
      document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (fileMode) render(); else load(); } });
      setInterval(render, 60000);
    })();
  </script>
</body>
</html>
